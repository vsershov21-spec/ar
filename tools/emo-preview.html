<!doctype html><html><head><meta charset="utf-8"><title>emotion preview</title>
<style>html,body{margin:0;background:#e6e6ea;color:#222;font:13px sans-serif}canvas{display:block}</style></head>
<body><script type="module">
// Эмоции и рот через НАСТОЯЩИЙ рантайм (GlbCharacter: setEmotion, липсинк setMouth, 3D-глаза, складки, тон меха,
// мех-оболочки) и свет приложения (src/app.ts: полусфера 2.2 + направленный 1.6, без тонмаппинга).
// ?p=glitter&m=/models/glitter_v1.glb&s=neutral,happy,laugh,talk:A&cols=4&tile=360&yaw=0&pitch=0&zoom=1&t=1.2
// Состояние: id пресета (setEmotion), «talk:A|O|E|U|M|F» — рот липсинка, «vis:A…H|X» — визема Rhubarb (риг p2),
// «emo>emo2@0.2» — кадр перехода через 0.2 с. ?face=morph|shader — лицо рига p2 или шейдером (modelVariant.ts faceMode).
import * as THREE from 'three';
// детерминированный Math.random (моргание, саккады, микромимика)
let seed = 12345; Math.random = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const { GlbCharacter } = await import('../src/character/glbCharacter.ts');
const q = new URLSearchParams(location.search);
const persona = q.get('p') || 'glitter';
const { variantGlb } = await import('../src/character/modelVariant.ts');
const url = q.get('m') || variantGlb(`/models/${persona}_v1.glb`);
const states = (q.get('s') || 'neutral').split(',');
const cols = +(q.get('cols') || Math.min(4, states.length));
const T = +(q.get('tile') || 360), zoom = +(q.get('zoom') || 1);
const yaw = +(q.get('yaw') || 0) * Math.PI / 180, pitch = +(q.get('pitch') || 0) * Math.PI / 180;
const rows = Math.ceil(states.length / cols);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: q.get('bg') === 'none' });
// KTX2 в сжатых моделях (dist/models/opt) — транскодер выбирает формат по рендереру, как в приложении
(await import('../src/core/glRenderer.ts')).setGlRenderer(r);
r.setPixelRatio(1); r.setSize(cols * T, rows * T); r.setScissorTest(true); document.body.appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace;
const sc = new THREE.Scene(); sc.background = new THREE.Color('#' + (q.get('bg') || 'e6e6ea'));
// фон-фото (кадр камеры со стола): ?bgimg=/tmpgl/table.jpg — проверка на «живом» фоне, свет и цвет как в приложении
if (q.get('bg') === 'none') { sc.background = null; r.setClearColor(0x000000, 0); }
if (q.get('bgimg')) { const t = await new THREE.TextureLoader().loadAsync(q.get('bgimg')); t.colorSpace = THREE.SRGBColorSpace; sc.background = t; }
sc.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 2.2));
const dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(0.5, 1, 1); sc.add(dl);
const ch = new GlbCharacter(url, q.get('anims') === '0' ? undefined : '/models/anims_v1.glb');
await ch.load();
ch.setPersona?.({ id: persona });
ch.clips.setIdles(['idle'], persona);
sc.add(ch.object);
ch.play('idle');
if (q.get('mdt') === '0' && ch.mouthRig) ch.mouthRig.mesh.material.depthTest = false;
if (q.get('hide')) ch.object.traverse((o) => { if (new RegExp(q.get('hide')).test(o.name)) o.visible = false; });
// сетка поверх меша (отладка кромки губ): ?wire=FaceSkin
if (q.get('wire')) ch.object.traverse((o) => { if (o.isMesh && new RegExp(q.get('wire')).test(o.name)) { o.material = o.material.clone(); o.material.wireframe = true; } });
ch.faceMix.nextBlink = 1e9;
ch.life.nextMicro = 1e9;
const bone = (n) => { let b = null; ch.object.traverse((o) => { if (!b && o.name.replace(/^mixamorig:?/, '') === n) b = o; }); return b; };
const cam = new THREE.PerspectiveCamera(22 / zoom, 1, 0.01, 50);
const camAt = () => {
  ch.object.updateMatrixWorld(true);
  const o = ch.object.getWorldPosition(new THREE.Vector3());
  const hp = bone('Head').getWorldPosition(new THREE.Vector3()), tp = bone('HeadTop_End').getWorldPosition(new THREE.Vector3());
  const c = hp.clone().lerp(tp, 0.62 + +(q.get('dy') || 0));
  const d = hp.distanceTo(tp) * (+(q.get("dist") || 10.5));
  cam.position.set(c.x + Math.sin(yaw) * Math.cos(pitch) * d, c.y + Math.sin(pitch) * d, c.z + Math.cos(yaw) * Math.cos(pitch) * d);
  cam.lookAt(c);
};
for (let k = 0; k < 20; k++) ch.update(1 / 30, cam);
camAt();
const SH = {
  A: { open: 0.9, wide: 0.4, round: 0 }, O: { open: 0.6, wide: 0, round: 0.85 }, E: { open: 0.35, wide: 0.9, round: 0 },
  U: { open: 0.12, wide: 0, round: 0.9 }, M: { open: 0, wide: 0, round: 0 }, F: { open: 0.15, wide: 0.3, round: 0 },
};
const hold = +(q.get('t') || 1.2);
// реплика с липсинком (?text=…): состояния «seq:<с>» — кадр на этой секунде реплики. Cues — из текста (русские буквы →
// виземы Rhubarb, lipsync/visemes.ts cuesFromText); LipSync сглаживает как в приложении, setMouth получает и сырую визему
const { LipSync } = await import('../src/lipsync/lipsync.ts');
const { cuesFromText, estimateSpeechSec } = await import('../src/lipsync/visemes.ts');
const lip = new LipSync();
let seqT = -1;
const text = q.get('text');
const seqCues = text ? cuesFromText(text, estimateSpeechSec(text)) : [];
window.__cues = seqCues;
const run = (sec) => { for (let k = 0; k < Math.round(sec * 30); k++) ch.update(1 / 30, cam); };
window.__seq = [];
states.forEach((st, i) => {
  if (st.startsWith('seq:')) {
    if (seqT < 0) {
      ch.clearEmotion(); ch.setMouth('X', 0, { open: 0, wide: 0, round: 0 }); run(0.8);
      seqT = 0;
      lip.playCues(seqCues, () => seqT);
    }
    const T = +st.slice(4);
    while (seqT < T - 1e-6) {
      const dt = 1 / 60;
      seqT += dt;
      lip.update(dt);
      ch.setMouth(lip.dominant, lip.weights[lip.dominant], lip.shape, lip.target);
      ch.update(dt, cam);
    }
    window.__seq.push({ t: T, cue: lip.target, vis: ch.faceMorphs ? { ...ch.faceMorphs.vis } : null });
  } else if (st.startsWith('blink:')) {
    // моргание: кадр через t с после начала (моргание 150 мс)
    ch.clearEmotion(); ch.setMouth('X', 0, { open: 0, wide: 0, round: 0 }); run(0.8);
    ch.faceMix.blink();
    run(+st.slice(6));
  } else {
  ch.clearEmotion(); ch.setMouth('X', 0, { open: 0, wide: 0, round: 0 }); run(0.8);
  if (st.startsWith('vis:')) {
    // визема Rhubarb напрямую (риг p2: драйвер морфов faceMorphs.ts, кроссфейд 75 мс)
    const v = st.slice(4);
    ch.setMouth(v, 1, { open: 0.5, wide: 0, round: 0 }, v);
    run(0.3);
  } else if (st.startsWith('talk:')) {
    const v = st.slice(5);
    ch.setMouth(v === 'M' ? 'A' : 'D', 1, SH[v] ?? SH.A);
    run(0.4);
  } else if (st.includes('>')) {
    const [a, rest] = st.split('>'); const [b, at] = rest.split('@');
    if (a !== 'neutral') ch.setEmotion(a, 1, 0);
    run(hold);
    ch.setEmotion(b, 1, 0);
    run(+at || 0.15);
  } else if (st !== 'neutral') {
    const [e, mouth] = st.split('+');
    ch.setEmotion(e, 1, 0);
    if (mouth) ch.setMouth('D', 1, SH[mouth]);
    run(hold);
  } else run(0.5);
  }
  camAt();
  const x = (i % cols) * T, y = (rows - 1 - Math.floor(i / cols)) * T;
  r.setViewport(x, y, T, T); r.setScissor(x, y, T, T); r.render(sc, cam);
});
window.__labels = states; window.__morphs = { W: { ...ch.W }, u: ch.mouthRig && ch.mouthRig.uniforms.uMA.value.toArray() }; window.__ready = true;
</script></body></html>
