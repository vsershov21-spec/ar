<!doctype html><html><head><meta charset="utf-8"><title>tail preview</title>
<style>html,body{margin:0;background:#2b2f33;color:#fff;font:14px sans-serif}#info{position:fixed;left:8px;top:8px}</style></head>
<body><div id="info"></div><script type="module">
import * as THREE from 'three';
import { GlbCharacter } from '../src/character/glbCharacter';
const q=new URLSearchParams(location.search);
const persona=q.get('p')||'hooligan', mode=q.get('m')||'happy', yaw=+(q.get('yaw')||200);
const r=new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth,innerHeight); document.body.appendChild(r.domElement);
const sc=new THREE.Scene(); sc.add(new THREE.HemisphereLight(0xffffff,0x445566,2.2)); const dl=new THREE.DirectionalLight(0xffffff,1.5); dl.position.set(1,2,2); sc.add(dl);
const cam=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.01,20);
const a=yaw*Math.PI/180; cam.position.set(Math.sin(a)*2.6,0.75,Math.cos(a)*2.6); cam.lookAt(0,0.45,0);
const ch=new GlbCharacter(`/models/${persona}_v1.glb`,'/models/anims_v1.glb'); await ch.load(); sc.add(ch.object);
ch.personaId=persona; if(q.get('col')==='0') ch.collider.enabled=false;
const clip=q.get('c')||{happy:'idle_breathe',sad:'idle_breathe',puff:'idle_breathe',angry:'idle_breathe',dance:'dance_'+persona,walk:'walk',sleep:'sleep_loop'}[mode]||'idle_breathe';
const face={happy:'happy',sad:'sad',puff:'surprised',angry:'offended',dance:'excited',walk:'neutral',sleep:'sleep'}[mode]||'neutral';
ch.play(clip,{loop:true}); ch.face(face);
let t=0; window.__frames=0;
function tick(){ ch.update(1/30,cam); r.render(sc,cam); t+=1/30; window.__frames++; document.getElementById('info').textContent=`${persona} · ${mode} · ${ch.tailOut?.mode}`; requestAnimationFrame(tick);} tick();
window.__ready=true; window.__ch=ch;
</script></body></html>
